<!doctype html>
<meta charset="utf-8">
<title>JobPilot</title>
<style>
  :root { --ink:#0f172a; --soft:#52607a; --line:#e2e5ec; --accent:#4338ca;
          --ok:#047857; --ok-bg:#d6f5e8; --warn:#92400e; --warn-bg:#fdf0d5;
          --bad:#b91c1c; --bad-bg:#fdeaea; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8ecf5; --soft:#9aa8c0; --line:#2a3550; --accent:#a5b4fc;
            --ok:#4ade80; --ok-bg:#0f3527; --warn:#fbbf24; --warn-bg:#3a2c0d;
            --bad:#fca5a5; --bad-bg:#3a1414; }
    body { background:#0b1020; }
  }
  * { box-sizing:border-box; }
  body { width:380px; margin:0; padding:14px; color:var(--ink);
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  h1 { margin:0 0 2px; font-size:16px; }
  .sub { margin:0 0 12px; color:var(--soft); font-size:12.5px; }
  .box { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
  .box.ok { background:var(--ok-bg); border-color:var(--ok); }
  .box.warn { background:var(--warn-bg); border-color:var(--warn); }
  .box.bad { background:var(--bad-bg); border-color:var(--bad); }
  .box b { display:block; margin-bottom:2px; }
  .box span { font-size:12.5px; }
  label { display:block; font-weight:650; font-size:12.5px; margin:10px 0 4px; }
  select, button { width:100%; font:inherit; min-height:38px; border-radius:9px; }
  select { padding:0 8px; border:1px solid var(--line); background:transparent; color:inherit; }
  button { border:0; background:var(--accent); color:#fff; font-weight:650; cursor:pointer; margin-top:10px; }
  @media (prefers-color-scheme: dark) { button { color:#0b1020; } }
  button.ghost { background:transparent; color:inherit; border:1px solid var(--line); }
  ul { margin:6px 0 0; padding-left:16px; font-size:12.5px; }
  li { margin-bottom:3px; }
  a { color:var(--accent); }
  .mode-note { font-size:12px; color:var(--soft); margin-top:6px; }
</style>

<h1>JobPilot</h1>
<p class="sub">Fills and submits applications — but only for jobs you qualify for, and never guesses a screening answer.</p>

<div id="bank" class="box"><b>Checking your answers…</b></div>

<label for="mode">What should it do</label>
<select id="mode">
  <option value="review">Fill only — I will review and submit</option>
  <option value="confirm">Fill, then ask me before submitting</option>
  <option value="auto">Fill and submit automatically</option>
</select>
<p class="mode-note" id="modeNote"></p>

<button id="run">Run on this page</button>
<button class="ghost" id="open">Open the full app</button>

<div id="out"></div>

<script src="engine.js"></script>
<script src="popup.js"></script>
